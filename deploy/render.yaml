services:
  # Unified Web Service (FastAPI + Vite PWA static bundle)
  - type: web
    name: dealsradar-eg
    env: python
    region: frankfurt # Low latency to Cairo / Egypt
    plan: free
    branch: main
    buildCommand: |
      # 1. Build Frontend Vite PWA
      cd frontend && npm install && npm run build && cd ..
      # 2. Copy compiled PWA assets to backend
      mkdir -p backend/dist
      cp -r frontend/dist/* backend/dist/
      # 3. Install Python Dependencies
      cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./dealsradar.db
      - key: CRAWL_INTERVAL_MINUTES
        value: "15"
      - key: VAPID_PUBLIC_KEY
        generateValue: false
        value: BCyqZ7r2o9O0jN4g6mR9B4BXZN8Q7zD1fM8N5bK4wL3vR2cT9xY7uI1oP0aE3dF5gH7jK9lZ1xC3vB5nN7mQ=
      - key: VAPID_PRIVATE_KEY
        generateValue: false
        value: MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgYVb4T6J8sQ2zD1fM8N5bK4wL3vR2cT9xY7uI1oP0aEK1e
