<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#475569" stroke-width="3" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#64748b" stroke-width="3" />
  
  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#334155" stroke-width="2" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#334155" stroke-width="2" />
  
  <!-- Glowing Deal Scanner Beam -->
  <path d="M256,256 L390,140 A180,180 0 0,0 256,76 Z" fill="url(#radar)" fill-opacity="0.25" />
  
  <!-- Center Flash / Fire Icon -->
  <circle cx="256" cy="256" r="40" fill="url(#radar)" />
  
  <!-- Lightning Bolt / Price Drop Arrow -->
  <path d="M245 220 L275 220 L250 255 L280 255 L235 305 L248 268 L225 268 Z" fill="#ffffff" />
  
  <!-- Detected Deals Blips -->
  <circle cx="340" cy="180" r="14" fill="#10b981" />
  <circle cx="340" cy="180" r="22" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />

  <circle cx="160" cy="320" r="10" fill="#f59e0b" />
  <circle cx="320" cy="350" r="12" fill="#ef4444" />
</svg>
