<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | DealsRadar EG</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --primary: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 440px;
      padding: 2.5rem;
      background: var(--card);
      border-radius: 1.5rem;
      border: 1px solid rgba(245, 158, 11, 0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin: 1rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      color: var(--primary);
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصال الإنترنت مقطوع حالياً. يمكنك تصفح الصفقات المحفوظة مسبقاً في الذاكرة المحلية للتطبيق.</p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة (Retry)</button>
  </div>
</body>
</html>
